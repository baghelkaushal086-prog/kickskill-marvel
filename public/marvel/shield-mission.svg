<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer Tactical Ring -->
  <circle cx="50" cy="50" r="47" stroke="#EC1D24" stroke-width="2.5" opacity="0.85" />
  <circle cx="50" cy="50" r="43" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="4 2" opacity="0.4" />
  
  <!-- Subtle Dark Radar Backdrop -->
  <circle cx="50" cy="50" r="42" fill="#0E1017" />
  <circle cx="50" cy="50" r="28" stroke="#EC1D24" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.3" />
  <circle cx="50" cy="50" r="14" stroke="#FFFFFF" stroke-width="0.5" opacity="0.2" />

  <!-- S.H.I.E.L.D. Stylized Eagle Silhouette in Silver & White -->
  <path
    d="M50 14 
       C46 24 36 28 24 30 
       C28 39 33 46 40 50 
       C33 52 26 51 19 48 
       C23 58 31 66 41 70 
       C34 71 28 69 22 66 
       C28 78 40 85 50 87 
       C60 85 72 78 78 66 
       C72 69 66 71 59 70 
       C69 66 77 58 81 48 
       C74 51 67 52 60 50 
       C67 46 72 39 76 30 
       C64 28 54 24 50 14 Z"
    fill="url(#shieldGrad)"
    stroke="#FFFFFF"
    stroke-width="0.8"
  />

  <!-- S.H.I.E.L.D. Chest Diamond -->
  <polygon points="50,44 43,56 57,56" fill="#EC1D24" />
  <!-- Center Vertical Keel -->
  <rect x="48.5" y="58" width="3" height="15" fill="#EC1D24" rx="1" />

  <defs>
    <linearGradient id="shieldGrad" x1="20" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
  </defs>
</svg>
